name: CI

on: [push, pull_request]

# What this pipeline guarantees:
#   1. The code builds, lints and unit-tests on a current toolchain.
#   2. The *release* binaries (static, from the NIRUBAR and NIRUWM crates) run
#      a real X session on Arch, Debian and Void.
#   3. Real Super+key presses switch workspaces, open terminals, tile, close
#      windows and quit.
#
# Distro source builds are not part of the matrix on purpose: Debian bookworm
# ships Rust 1.63 and the toolchain there cannot build this crate. The shipped
# artifacts are static musl binaries, which is what users run.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/src:ro koalaman/shellcheck:stable \
            -S warning -s sh -e SC1007 /src/install.sh /src/session/niruwm-session \
            /src/tests/session-smoke.sh /src/tests/keyboard-smoke.sh

  session:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:bookworm-slim
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl wget git cargo rustc gcc xvfb x11-utils x11-apps xterm xdotool xkb-data fonts-dejavu-core procps
          - distro: arch
            image: archlinux:base
            setup: pacman -Syu --noconfirm --needed ca-certificates curl git rust gcc xorg-server-xvfb xorg-xprop xorg-xwininfo xorg-xsetroot xorg-xset xorg-setxkbmap xorg-xmodmap xkeyboard-config xterm xdotool ttf-dejavu procps-ng
          - distro: void
            image: voidlinux/voidlinux:latest
            setup: |
              for d in /etc/xbps.d /usr/share/xbps.d; do
                for conf in "$d"/*.conf; do
                  [ -f "$conf" ] || continue
                  sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$conf"
                done
              done
              xbps-install -Suy xbps && xbps-install -Suy
              xbps-install -Sy ca-certificates curl git rust cargo gcc xorg-server-xvfb xprop || true
              xbps-install -Sy xorg-server-xvfb xprop xwininfo xterm xdotool xset setxkbmap xkeyboard-config dejavu-fonts-ttf procps-ng
    container: ${{ matrix.image }}
    steps:
      # Void ships no libstdc++ by default, and the runner's Node needs it
      # before any action can start. Install it with a plain shell step first.
      - name: Bootstrap libstdc++ (Void only)
        if: matrix.distro == 'void'
        shell: sh
        run: |
          for d in /etc/xbps.d /usr/share/xbps.d; do
            for conf in "$d"/*.conf; do
              [ -f "$conf" ] || continue
              sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$conf"
            done
          done
          xbps-install -Suy xbps >/dev/null 2>&1 || true
          xbps-install -Sy libstdc++ ca-certificates >/dev/null 2>&1 || true
      - uses: actions/checkout@v4
      - name: Install X test tools
        shell: sh
        run: ${{ matrix.setup }}

      # Both programs are built from source where the toolchain allows it.
      # Debian bookworm ships Rust 1.63, which cannot build these crates, so it
      # gets its binaries from the *current* release. The version is read from
      # Cargo.toml rather than hardcoded, so a release never has to exist at a
      # URL this file guessed.
      - name: Stage the binaries
        shell: sh
        run: |
          set -eu
          mkdir -p /tmp/niru/bin /tmp/niru/.config/niruwm/themes
          modern=0
          if command -v cargo >/dev/null 2>&1 &&
             cargo --version | awk '{print $2}' | awk -F. '$2 >= 75 {ok=1} END {exit !ok}'; then
            modern=1
          fi
          if [ "$modern" = 1 ]; then
            echo "building both from source"
            git clone --depth 1 --branch main https://github.com/nirucon/nirubar /tmp/nirubar-src
            ( cd /tmp/nirubar-src && cargo build --release --locked )
            cp /tmp/nirubar-src/target/release/nirubar /tmp/niru/bin/
            cargo build --release --locked
            cp target/release/niruwm target/release/niructl target/release/niruidle /tmp/niru/bin/
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            url="https://github.com/nirucon/niruwm/releases/download/v$version"
            echo "toolchain too old; using the v$version release binaries"
            if command -v curl >/dev/null 2>&1; then GET="curl -fsSL -o"; else GET="wget -qO"; fi
            for b in niruwm nirubar niructl niruidle; do
              $GET "/tmp/niru/bin/$b" "$url/$b"
              chmod +x "/tmp/niru/bin/$b"
            done
            test "$(/tmp/niru/bin/nirubar --version | awk '{print $2}')" = "$version"
            test "$(/tmp/niru/bin/niruwm --version | awk '{print $2}')" = "$version"
          fi
          cp session/niruwm-session /tmp/niru/bin/
          chmod +x /tmp/niru/bin/*
          cp config.example.toml /tmp/niru/.config/niruwm/config.toml
          cp themes/niru-noir.toml /tmp/niru/.config/niruwm/themes/

      - name: Session smoke test
        shell: sh
        run: sh tests/session-smoke.sh /tmp/niru/bin /tmp/niru

      - name: Replay scripts
        shell: sh
        run: |
          printf 'theme = "niru-noir"\nterminal = ["xterm"]\n\n[scratchpad]\ncommand = ["xterm", "-class", "scratchpad"]\n' \
            > /tmp/niru/.config/niruwm/config.toml
          Xvfb :77 -screen 0 1000x700x24 -nolisten tcp &
          sleep 2
          DISPLAY=:77 HOME=/tmp/niru PATH=/tmp/niru/bin:$PATH sh -c '
            niruwm & sleep 2
            for f in tests/replay/*.txt; do
              echo "--- $f ---"
              niruwm --replay "$f" || exit 1
              niructl tag 1 >/dev/null 2>&1 || true
              sleep 1
            done
          '
      - name: Keyboard smoke test
        shell: sh
        run: sh tests/keyboard-smoke.sh /tmp/niru/bin /tmp/niru
