name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Build the static binary and drive a real X session with it. This is
      # the test that matters: can a user start the session and use it?
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Install X test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils x11-apps xterm fonts-dejavu-core procps
      - name: Session smoke test
        run: |
          mkdir -p /tmp/niru/bin /tmp/niru/.config/niruwm/themes
          cp target/x86_64-unknown-linux-musl/release/{niruwm,nirubar,niructl} /tmp/niru/bin/
          cp session/niruwm-session /tmp/niru/bin/
          chmod +x /tmp/niru/bin/*
          cp config.example.toml /tmp/niru/.config/niruwm/config.toml
          cp themes/niru-noir.toml /tmp/niru/.config/niruwm/themes/
          sh tests/session-smoke.sh /tmp/niru/bin /tmp/niru
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/src:ro koalaman/shellcheck:stable \
            -S warning -s sh -e SC1007 /src/install.sh /src/session/niruwm-session /src/tests/session-smoke.sh

  distros:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:bookworm-slim
            setup: apt-get update && apt-get install -y cargo rustc gcc git ca-certificates pkg-config
          - distro: arch
            image: archlinux:base-devel
            setup: pacman -Syu --noconfirm --needed rust git ca-certificates
          - distro: void
            image: voidlinux/voidlinux:latest
            setup: |
              for d in /etc/xbps.d /usr/share/xbps.d; do
                for conf in "$d"/*.conf; do
                  [ -f "$conf" ] || continue
                  sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$conf"
                done
              done
              xbps-install -Suy xbps
              xbps-install -Suy
              xbps-install -Sy rust cargo gcc git libstdc++ ca-certificates
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install toolchain
        shell: sh
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: Build
        shell: sh
        # Debian bookworm ships Rust 1.63, which is below this crate's MSRV.
        # The release binaries are static; this job proves the build works on
        # the distro toolchain where it is new enough and fails loudly where
        # it is not, instead of claiming support that does not exist.
        run: |
          cargo --version
          cargo test --locked && cargo build --release --locked
      - name: Session smoke test
        shell: sh
        run: |
          if [ -f /etc/debian_version ]; then
            apt-get update && apt-get install -y xvfb x11-utils x11-apps xterm fonts-dejavu-core procps
          elif command -v pacman >/dev/null; then
            pacman -S --noconfirm --needed xorg-server-xvfb xorg-xprop xorg-xwininfo xorg-xrdb xterm ttf-dejavu procps-ng
          else
            xbps-install -Sy xorg-server-xvfb xprop xwininfo xterm dejavu-fonts-ttf procps-ng
          fi
          mkdir -p /tmp/niru/bin /tmp/niru/.config/niruwm/themes
          cp target/release/{niruwm,nirubar,niructl} /tmp/niru/bin/
          cp session/niruwm-session /tmp/niru/bin/
          chmod +x /tmp/niru/bin/*
          cp config.example.toml /tmp/niru/.config/niruwm/config.toml
          cp themes/niru-noir.toml /tmp/niru/.config/niruwm/themes/
          sh tests/session-smoke.sh /tmp/niru/bin /tmp/niru
