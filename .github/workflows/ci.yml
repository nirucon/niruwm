name: CI

on: [push, pull_request]

# What this pipeline guarantees:
#   1. The code builds, lints and unit-tests on a current toolchain.
#   2. The *release* binaries (static, from the NIRUBAR and NIRUWM crates) run
#      a real X session on Arch, Debian and Void.
#   3. Real Super+key presses switch workspaces, open terminals, tile, close
#      windows and quit.
#
# Distro source builds are not part of the matrix on purpose: Debian bookworm
# ships Rust 1.63 and the toolchain there cannot build this crate. The shipped
# artifacts are static musl binaries, which is what users run.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Key overrides, helper reaping and fullscreen regressions
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool xterm x11-xserver-utils
          xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' cargo test --locked --test x11 -- --ignored --test-threads=1
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Offline microphone and Bluetooth controls
        run: |
          sh tests/audio-microphone.sh "$PWD/target/x86_64-unknown-linux-musl/release/niructl"
          sh tests/bluetooth.sh "$PWD/target/x86_64-unknown-linux-musl/release/niructl"
          sh tests/power-profile.sh "$PWD/target/x86_64-unknown-linux-musl/release/niructl"
      - name: Display profile lifecycle (Xvfb/RandR)
        run: sh tests/display-profiles.sh "$PWD/target/x86_64-unknown-linux-musl/release/niructl"
      - name: Build pinned bar and collect static test artifacts
        run: |
          git clone --depth 1 --branch "v$(cat nirubar-version)" https://github.com/nirucon/nirubar /tmp/nirubar-build
          cargo build --manifest-path /tmp/nirubar-build/Cargo.toml --release --locked --target x86_64-unknown-linux-musl
          mkdir -p /tmp/ci-bin
          cp target/x86_64-unknown-linux-musl/release/{niruwm,niructl,niruidle} /tmp/ci-bin/
          cp /tmp/nirubar-build/target/x86_64-unknown-linux-musl/release/nirubar /tmp/ci-bin/
      - name: Standalone installer regression
        run: sh tests/install-smoke.sh /tmp/ci-bin/nirubar
      - uses: actions/upload-artifact@v4
        with:
          name: session-binaries
          path: /tmp/ci-bin/*
          retention-days: 3

      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/src:ro koalaman/shellcheck:stable \
            -S warning -s sh -e SC1007 /src/install.sh /src/session/niruwm-session \
            /src/tests/session-smoke.sh /src/tests/keyboard-smoke.sh /src/tests/install-smoke.sh

  session:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:bookworm-slim
            setup: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git xvfb x11-utils x11-apps xterm xdotool xkb-data fonts-dejavu-core procps
          - distro: arch
            image: archlinux:base
            setup: pacman -Syu --noconfirm --needed ca-certificates curl git xorg-server-xvfb xorg-xprop xorg-xwininfo xorg-xsetroot xorg-xset xorg-setxkbmap xorg-xmodmap xkeyboard-config xterm xdotool ttf-dejavu procps-ng
          - distro: void
            image: voidlinux/voidlinux:latest
            setup: |
              for d in /etc/xbps.d /usr/share/xbps.d; do
                for conf in "$d"/*.conf; do
                  [ -f "$conf" ] || continue
                  sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$conf"
                done
              done
              xbps-install -Suy xbps && xbps-install -Suy
              xbps-install -Sy ca-certificates curl git xorg-server-xvfb xprop xwininfo xterm xdotool xset setxkbmap xkeyboard-config dejavu-fonts-ttf procps-ng
    container: ${{ matrix.image }}
    steps:
      # Void ships no libstdc++ by default, and the runner's Node needs it
      # before any action can start. Install it with a plain shell step first.
      - name: Bootstrap libstdc++ (Void only)
        if: matrix.distro == 'void'
        shell: sh
        run: |
          for d in /etc/xbps.d /usr/share/xbps.d; do
            for conf in "$d"/*.conf; do
              [ -f "$conf" ] || continue
              sed -i 's#alpha.de.repo.voidlinux.org#repo-default.voidlinux.org#g' "$conf"
            done
          done
          xbps-install -Suy xbps >/dev/null 2>&1 || true
          xbps-install -Sy libstdc++ ca-certificates >/dev/null 2>&1 || true
      - uses: actions/checkout@v4
      - name: Install X test tools
        shell: sh
        run: ${{ matrix.setup }}

      - uses: actions/download-artifact@v4
        with:
          name: session-binaries
          path: /tmp/niru/bin

      # Test this commit's static artifacts, never a release that may not exist
      # yet or a different bar version guessed from the WM's version number.
      - name: Stage the binaries
        shell: sh
        run: |
          set -eu
          mkdir -p /tmp/niru/bin /tmp/niru/.config/niruwm/themes
          cp session/niruwm-session /tmp/niru/bin/
          chmod +x /tmp/niru/bin/*
          cp config.example.toml /tmp/niru/.config/niruwm/config.toml
          cp themes/niru-noir.toml /tmp/niru/.config/niruwm/themes/

      - name: Session smoke test
        shell: sh
        run: sh tests/session-smoke.sh /tmp/niru/bin /tmp/niru

      - name: Replay scripts
        shell: sh
        run: |
          {
            printf 'theme = "niru-noir"\nterminal = ["xterm"]\n'
            printf '\n[scratchpad]\ncommand = ["xterm", "-class", "scratchpad"]\n'
          } > /tmp/niru/.config/niruwm/config.toml
          Xvfb :77 -screen 0 1000x700x24 -nolisten tcp &
          sleep 2
          DISPLAY=:77 HOME=/tmp/niru PATH=/tmp/niru/bin:$PATH sh -c '
            # A missing keyboard map makes xdotool fall back to whatever Xvfb
            # started with, where Super and Shift can collapse into one
            # modifier. The smoke test already does this; the replay did not.
            if command -v setxkbmap >/dev/null 2>&1; then setxkbmap se || setxkbmap us; fi
            niruwm & sleep 2
            # The window manager must come from the binaries staged above
            # (built from this commit), never from a release of an older
            # version that happens to be in PATH. 0.13.0 replayed against an
            # older window manager and failed a step that works in this one.
            echo "replaying against $(command -v niruwm) $(niruwm --version)"
            for f in tests/replay/*.txt; do
              echo "--- $f ---"
              niruwm --replay "$f" || exit 1
              niructl tag 1 >/dev/null 2>&1 || true
              sleep 1
            done
          '
      - name: Keyboard smoke test
        shell: sh
        run: sh tests/keyboard-smoke.sh /tmp/niru/bin /tmp/niru
