name: Release (BETA — assets published to niruwm)

# NIRUWM and NIRUBAR are separate repositories but ship as one session.
# This workflow checks out both, builds static binaries, cross-checks that the
# bar renders in a real X server, and attaches everything to one release on
# the NIRUWM repository so `install.sh` can install a consistent pair.
#
# Tag NIRUWM with vX.Y.Z. The tag push builds and publishes that tag, so the
# published assets always come from the source the tag names.
#
# `workflow_dispatch` remains for a rebuild of an EXISTING tag only: it takes
# the tag as input, refuses to run for any ref other than a tag, and fails when
# the version in Cargo.toml does not match the tag. A release must never be
# published from a branch: v0.16.64 once shipped assets built from `main`
# while its tag pointed at a different commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to rebuild, for example v0.16.79"
        required: true
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A tag push checks out its own tag. A manual run is only a rebuild of
      # the tag given as input. Either way the build source is a tag, never a
      # branch, so published assets and the tag cannot describe different code.
      - name: Refuse anything that is not a tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$INPUT_TAG" ] || { echo "refusing: a tag is required"; exit 1; }
            case "$INPUT_TAG" in
              v*) : ;;
              *) echo "refusing: tag must start with v"; exit 1 ;;
            esac
            echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"
          else
            case "$REF" in
              refs/tags/v*) echo "TAG=${REF#refs/tags/}" >> "$GITHUB_ENV" ;;
              *) echo "refusing: release must be built from a v* tag, got $REF"; exit 1 ;;
            esac
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: niruwm
      - name: Confirm the tag matches the version being built
        run: |
          version=$(awk -F '"' '/^version = / {print $2; exit}' niruwm/Cargo.toml)
          [ "v$version" = "$TAG" ] || {
            echo "refusing: Cargo.toml says v$version but the tag is $TAG"; exit 1;
          }
      - name: Read the pinned bar version
        id: pinned-bar
        run: echo "ref=v$(cat niruwm/nirubar-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: nirucon/nirubar
          ref: ${{ steps.pinned-bar.outputs.ref }}
          path: nirubar
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Release gate
        working-directory: niruwm
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 -m py_compile session/niruclipboard session/nirugestured

      - name: Build NIRUWM
        working-directory: niruwm
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Build NIRUBAR
        working-directory: nirubar
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Check bundled versions match
        working-directory: nirubar
        run: |
          got=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          want=$(cat "$GITHUB_WORKSPACE/niruwm/nirubar-version")
          echo "bundled nirubar: $got"
          if [ -n "$want" ] && [ "$got" != "$want" ]; then
            echo "::error::nirubar is $got but this release expects $want"
            exit 1
          fi

      - name: Verify the binaries are static
        run: |
          for bin in niruwm/target/x86_64-unknown-linux-musl/release/niruwm \
                     niruwm/target/x86_64-unknown-linux-musl/release/niruidle \
                     nirubar/target/x86_64-unknown-linux-musl/release/nirubar; do
            file "$bin"
            if ldd "$bin" 2>&1 | grep -q "=>"; then
              echo "::error::$bin is dynamically linked"
              exit 1
            fi
          done

      - name: Release smoke test (real X session)
        run: |
          sudo apt-get install -y xvfb x11-utils x11-apps x11-xserver-utils xterm fonts-dejavu-core procps
          mkdir -p /tmp/niru/bin /tmp/niru/.config/niruwm/themes
          cp niruwm/target/x86_64-unknown-linux-musl/release/{niruwm,niructl,niruidle} /tmp/niru/bin/
          cp nirubar/target/x86_64-unknown-linux-musl/release/nirubar /tmp/niru/bin/
          cp niruwm/session/niruwm-session /tmp/niru/bin/
          chmod +x /tmp/niru/bin/*
          cp niruwm/config.example.toml /tmp/niru/.config/niruwm/config.toml
          cp niruwm/themes/niru-noir.toml /tmp/niru/.config/niruwm/themes/
          sh niruwm/tests/session-smoke.sh /tmp/niru/bin /tmp/niru
          sh niruwm/tests/audio-microphone.sh /tmp/niru/bin/niructl
          sh niruwm/tests/bluetooth.sh /tmp/niru/bin/niructl
          sh niruwm/tests/power-profile.sh /tmp/niru/bin/niructl
          sh niruwm/tests/power-actions.sh /tmp/niru/bin/niructl
          sh niruwm/tests/display-profiles.sh /tmp/niru/bin/niructl

      - name: Collect assets
        run: |
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          cp niruwm/target/x86_64-unknown-linux-musl/release/{niruwm,niructl,niruidle} dist/
          cp nirubar/target/x86_64-unknown-linux-musl/release/nirubar dist/
          cp niruwm/session/niruwm-session dist/
          cp niruwm/session/niruclipboard dist/
          cp niruwm/session/nirugestured dist/
          cp niruwm/nirubar-version dist/
          cd dist && sha256sum niruwm nirubar niructl niruidle niruwm-session niruclipboard nirugestured nirubar-version > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # A tag push releases that tag. A manual run releases the version in
          # Cargo.toml, never a beta suffix: the download URL in install.sh
          # expects vX.Y.Z.
          tag_name: ${{ env.RELEASE_TAG }}
          make_latest: true
          files: |
            dist/niruwm
            dist/nirubar
            dist/niructl
            dist/niruidle
            dist/niruwm-session
            dist/niruclipboard
            dist/nirugestured
            dist/nirubar-version
            dist/SHA256SUMS
          generate_release_notes: true
