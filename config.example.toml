[[keys]]
keys = "super+1"
action = "tag 1"

[[keys]]
keys = "super+2"
action = "tag 2"

[[keys]]
keys = "super+3"
action = "tag 3"

[[keys]]
keys = "super+4"
action = "tag 4"

[[keys]]
