[package]
name = "niruwm"
version = "0.16.146"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Minimal NIRU X11 desktop component"

[dependencies]
x11rb = { version = "0.13", features = ["randr", "screensaver"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
chrono = "0.4"
libc = "0.2"
png = "0.17"
sha2 = "0.10"
# Keep the lockfile compatible with the declared Rust 1.75 baseline.
indexmap = "=2.7.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
